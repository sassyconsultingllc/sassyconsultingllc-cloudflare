# Deploy the sassyconsultingllc Worker (code + static assets) on every push to
# main, so a merged PR is a deployed PR. Replaces deploying by hand from a
# workstation. Needs one repository secret:
#   CLOUDFLARE_API_TOKEN — a Cloudflare API token from the "Edit Cloudflare
#   Workers" template, scoped to the Sassy Consulting LLC account.
# account_id comes from wrangler.jsonc.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once, and never cancel one mid-upload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Diagnose a bad token without revealing it: its length, whether it
          # carries stray whitespace, and whether Cloudflare accepts it as an
          # active user token or account token.
          ws=no
          case "$CLOUDFLARE_API_TOKEN" in *[[:space:]]*) ws=yes ;; esac
          echo "Token length: ${#CLOUDFLARE_API_TOKEN} characters; contains whitespace: $ws"
          account_id=$(grep -oE '"account_id"[[:space:]]*:[[:space:]]*"[0-9a-f]{32}"' wrangler.jsonc | grep -oE '[0-9a-f]{32}')
          check() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/$1" 2>/dev/null | jq -r '.result.status // empty'
          }
          user_status=$(check user/tokens/verify || true)
          account_status=$(check "accounts/$account_id/tokens/verify" || true)
          echo "Cloudflare: user-token check = ${user_status:-rejected}; account-token check = ${account_status:-rejected}"
          if [ "$user_status" != "active" ] && [ "$account_status" != "active" ]; then
            echo "::error::Cloudflare does not accept CLOUDFLARE_API_TOKEN as an active API token. Paste only the token value shown once at creation (not its name, its ID, the Global API Key, or the test command)."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Check worker syntax
        run: node --check src/worker.js

      # `npm run deploy` runs the predeploy sitemap build, then `wrangler deploy`.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: npm run deploy
